name: CI Pipeline

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev" ]

jobs:
  lint-and-test:
    name: Lint & Run Tests
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction_user
          POSTGRES_PASSWORD: auction_password
          POSTGRES_DB: auction_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://auction_user:auction_password@localhost:5433/auction_test_db?sslmode=disable"
      JWT_SECRET: "ci-test-secret-key"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          skip-pkg-cache: true
          skip-build-cache: true

      - name: Install goose for DB migrations
        run: |
          curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh -s -- -b /home/runner/go/bin
          echo "/home/runner/go/bin" >> $GITHUB_PATH

      - name: Run database migrations
        run: goose -dir ./migrations postgres "$DATABASE_URL" up

      - name: Run Unit and Integration Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...