name: Deploy Auction System to Self-Hosted Server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Получение свежего кода из Git
        uses: actions/checkout@v4

      - name: 2. Проверка сборки Docker-образов
        run: |
          docker compose build

      - name: 3. Перезапуск контейнеров (только для ветки main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker compose up -d --remove-orphans
          docker image prune -f