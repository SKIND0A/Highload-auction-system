services:
  postgres:
    image: postgres:16-alpine
    container_name: auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-auction_db}
    
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auction-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auction_user} -d ${POSTGRES_DB:-auction_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-auction_user}:${POSTGRES_PASSWORD:-auction_secret_pass}@postgres:5432/${POSTGRES_DB:-auction_db}?sslmode=disable"
    networks:
      - auction-network

volumes:
  postgres_data:
    driver: local

networks:
  auction-network:
    driver: bridge